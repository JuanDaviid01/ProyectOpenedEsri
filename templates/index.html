<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Homologar Electiva</title>
  <link rel="icon" type="image/png" href="../static/logoum.png">
  <link rel="stylesheet" href="../static/estilos.css">
</head>

<body>
  <div id="toast-container" class="toast-container"></div>

  <header class="barra-opened">
    <div class="logo-capsula">
      <a href="https://www.umanizales.edu.co/" target="_blank">
        <img src="../static/logoum.png" alt="Universidad de Manizales" class="logo-opened">
      </a>
    </div>
    <div class="barra-usuario">
      <span class="nombre-sesion">{{ nombre_usuario }}</span>
      <a href="/logout" class="btn-logout">Cerrar sesión</a>
    </div>
  </header>

  <main class="contenedor-principal">
    <section class="card-formulario">
      <div class="encabezado-formulario">
        <h1>HOMOLOGACION DE ELECTIVAS</h1>
        <p>Ingrese el código del estudiante y cargue los archivos requeridos.</p>
      </div>

      <form class="formulario-radicado">
        <div class="grupo-campo">
          <label for="codigo_estudiante">Código del estudiante</label>
          <input type="text" id="codigo_estudiante" name="codigo_estudiante" placeholder="Ingrese el código">
        </div>

        <div class="grupo-campo">
          <label for="programa_destino">Programa</label>
          <select id="programa_destino" name="programa_destino">
            <option value="" selected disabled>Seleccionar programa</option>
            <option value="Ingeniería en Sistemas y Telecomunicaciones Presencial">Ingeniería en Sistemas y
              Telecomunicaciones Presencial</option>
            <option value="Ingeniería en Sistemas y Telecomunicaciones Virtual">Ingeniería en Sistemas y
              Telecomunicaciones Virtual</option>
            <option value="Ingeniería en analítica de datos presencial">Ingeniería en analítica de datos presencial
            </option>
            <option value="Ingeniería en analítica de datos virtual">Ingeniería en analítica de datos virtual</option>
            <option value="Ingeniería Logística Presencial">Ingeniería Logística Presencial</option>
            <option value="Ingeniería Logística Virtual">Ingeniería Logística Virtual</option>
            <option value="Ingeniería en Seguridad de la Información Presencial">Ingeniería en Seguridad de la
              Información Presencial</option>
            <option value="Ingeniería en Seguridad de la Información Virtual">Ingeniería en Seguridad de la Información
              Virtual</option>
            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
            <option value="Especialización en Sistemas de información geográfica">Especialización en Sistemas de
              Información geográfica</option>
            <option value="Maestría en Tecnologías de la información geográfica">Maestría en Tecnologías de la
              información geográfica</option>
            <option value="Maestría en Educación y transformación digital">Maestría en Educación y transformación
              digital</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="materia_homologar">Materia a homologar</label>
          <select id="materia_homologar" name="materia_homologar" disabled>
            <option value="" selected disabled>Seleccione primero un programa</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label>Responsable</label>
          <div class="responsable-display">{{ nombre_usuario }}</div>
        </div>

        <div class="grupo-campo">
          <label for="tipo_certificado">Proveedor del Certificado</label>
          <select id="tipo_certificado" name="tipo_certificado">
            <option value="" selected disabled>Seleccionar proveedor</option>
            <option value="opened">Opened</option>
            <option value="esri">Esri</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label>Tipo de nota</label>
          <div class="segmentador" id="tipo_nota">
            <button type="button" class="seg-opcion activo" data-valor="cuantitativa">Cuantitativa</button>
            <button type="button" class="seg-opcion" data-valor="cualitativa">Cualitativa</button>
          </div>
          <input type="hidden" id="tipo_nota_valor" value="cuantitativa">
        </div>

        <div class="grupo-campo">
          <label for="archivos">Cargar archivos</label>
          <div class="zona-archivo">
            <input type="file" id="archivos" name="archivos" multiple>
            <label for="archivos" class="btn-principal">Seleccionar archivos</label>
            <span class="texto-archivo">Adjunte archivos en PDF, JPG o PNG</span>
          </div>
        </div>

        <div class="grupo-campo">
          <label>Archivos seleccionados</label>
          <div class="lista-archivos">
            <div class="archivo-item">No hay archivos cargados</div>
          </div>
        </div>

        <div class="acciones-formulario">
          <button type="button" id="btn-validar" class="btn-principal">
            Validar Documentos
          </button>

          <button type="button" id="btn-generar" class="btn-secundario" disabled>
            Generar Resolucion
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../static/app.js"></script>
</body>

</html>
