<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Homologar Electiva</title>
  <link rel="stylesheet" href="../static/estilos.css">
</head>

<body>

  <header class="barra-opened">
    <div class="logo-capsula">
      <a href="https://opened.com.co/" target="_blank">
        <img src="../static/opened.png" alt="Opened" class="logo-opened">
      </a>
    </div>
  </header>

  <main class="contenedor-principal">
    <section class="card-formulario">
      <div class="encabezado-formulario">
        <h1>HOMOLOGACION DE ELECTIVAS</h1>
        <p>Ingrese el código del estudiante y cargue los archivos requeridos.</p>
      </div>

      <form class="formulario-radicado">
        <div class="grupo-campo">
          <label for="codigo_estudiante">Código del estudiante</label>
          <input type="text" id="codigo_estudiante" name="codigo_estudiante" placeholder="Ingrese el código">
        </div>
        <div class="grupo-campo">
          <label for="programa_destino">Programa</label>
          <select id="programa_destino" name="programa_destino">
            <option value="" selected disabled>Seleccionar programa</option>

            <option value="Ingeniería de Sistemas y Telecomunicaciones">
              Ingeniería de Sistemas y Telecomunicaciones
            </option>

            <option value="Ingeniería Industrial">
              Ingeniería Industrial
            </option>

            <option value="Ingeniería de Software">
              Ingeniería de Software
            </option>

            <option value="Ingeniería en Analítica de Datos">
              Ingeniería en Analítica de Datos
            </option>

            <option value="Ingeniería en Seguridad de la Información">
              Ingeniería en Seguridad de la Información
            </option>
          </select>
        </div>
        <div class="grupo-campo">
          <label for="responsable_resolucion">Responsable</label>
          <input type="text" id="responsable_resolucion" name="responsable_resolucion" placeholder="Ingrese su nombre">
        </div>
        <div class="grupo-campo">
          <label for="tipo_certificado">Proveedor del Certificado</label>
          <select id="tipo_certificado" name="tipo_certificado">
            <option value="" selected disabled>Seleccionar proveedor</option>
            <option value="opened">Opened</option>
            <option value="esri">Esri</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="archivos">Cargar archivos</label>
          <div class="zona-archivo">
            <input type="file" id="archivos" name="archivos" multiple>
            <label for="archivos" class="boton-cargar">Seleccionar archivos</label>
            <span class="texto-archivo">Adjunte archivos en PDF, JPG o PNG</span>
          </div>
        </div>

        <div class="grupo-campo">
          <label>Archivos seleccionados</label>
          <div class="lista-archivos">
            <div class="archivo-item">No hay archivos cargados</div>
          </div>
        </div>

        <div class="grupo-campo">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" name="observaciones" rows="4"
            placeholder="Escriba una observación si aplica"></textarea>
        </div>

        <div class="acciones-formulario">
          <button type="button" id="btn-validar" class="btn-principal">
            Validar Documentos
          </button>

          <button type="button" id="btn-generar" class="btn-secundario">
            Generar Resolucion
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="../static/app.js"></script>
</body>

</html>
